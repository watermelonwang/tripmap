<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅圖・共用地點地圖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#aad3df; --panel:#ffffff; --panel-2:#f3f4f2; --line:#e2e3df;
  --ink:#1d272b; --ink-2:#5b666a; --ink-3:#8a9497;
  --accent:#1e6a72; --accent-ink:#ffffff; --danger:#b8402f;
  --shadow:0 6px 24px rgba(20,35,40,.16);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --tile-filter:none;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --sea:#1a2a30; --panel:#141c20; --panel-2:#1b2529; --line:#2a363b;
    --ink:#e5ecee; --ink-2:#a7b3b7; --ink-3:#77858a;
    --accent:#5fb7bf; --accent-ink:#0b1417; --danger:#e07562;
    --shadow:0 6px 24px rgba(0,0,0,.5);
    --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  height:100%;margin:0;font-family:var(--font);font-size:15px;line-height:1.5;
  color:var(--ink);background:var(--panel);
  display:grid;grid-template-columns:minmax(300px,380px) 1fr;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- panel ---------- */
#panel{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.head{padding:16px 18px 10px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.who img{width:22px;height:22px;border-radius:50%}
.who .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--ink-2);text-decoration:underline;padding:0;font-size:13px}
#tripTitle{
  font-family:var(--display);font-size:28px;font-weight:700;line-height:1.2;
  border:0;background:transparent;width:100%;padding:2px 0;border-bottom:1px dashed transparent;
}
#tripTitle:hover:not(:disabled),#tripTitle:focus{border-bottom-color:var(--line);outline:none}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status.live i{background:#3aa66b}
.status.warn i{background:#d79a2b}

.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 6px;margin-bottom:-1px;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpane{flex:1;min-height:0;overflow:auto;padding:14px 16px 96px}

.section-title{font-size:13px;color:var(--ink-2);margin:4px 0 8px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.cat[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip.cat[aria-pressed="true"]{background:var(--panel);color:var(--ink);border-color:var(--c)}
.chip.add{border-style:dashed}

#search{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin-bottom:10px}
#placeList{list-style:none;margin:0;padding:0}
#placeList li+li{border-top:1px solid var(--line)}
.place{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:10px 4px;border-radius:8px}
.place:hover{background:var(--panel-2)}
.place .sw{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:5px;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--c)}
.place .nm{font-weight:500;display:block}
.place .sub{font-size:12.5px;color:var(--ink-3);display:block}
.place .lbl{font-size:12px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);white-space:nowrap;margin-top:2px}
.empty{color:var(--ink-2);font-size:14px;padding:18px 4px;line-height:1.7}

.row{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center;padding:6px 0}
.row input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
.row input[type=text]{border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:8px;width:100%}
.row input[type=text]:hover,.row input[type=text]:focus{border-color:var(--line);background:var(--panel-2);outline:none}
.row .count{font-size:12px;color:var(--ink-3)}
.row .mail{padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:none;color:var(--ink-3);padding:6px;border-radius:8px;line-height:0}
.icon-btn:hover{color:var(--danger);background:var(--panel-2)}
.listicon{width:30px;height:30px;display:grid;place-items:center;color:var(--ink-3)}
.addrow{display:flex;gap:8px;margin:8px 0 22px}
.addrow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:transparent;background:none;padding-left:4px}
.btn:disabled{opacity:.5;cursor:default}
.note-box{font-size:13px;color:var(--ink-2);background:var(--panel-2);border-radius:10px;padding:10px 12px;margin-bottom:10px}

#fab{
  position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:900;
  display:flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow)
}

/* ---------- map ---------- */
#mapWrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--font)}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel-2)}

.pin{position:absolute;left:-8px;top:-8px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pin .dot{width:16px;height:16px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);flex:none}
.pin .tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--panel);color:var(--ink);border-left:3px solid var(--c);box-shadow:0 1px 5px rgba(0,0,0,.22)}
.pin .pn{display:none;font-weight:500}
.show-names .pin .pn{display:inline}
.show-names .pin .lb+.pn::before{content:"｜";color:var(--ink-3)}
.hide-tags .pin .tag{display:none}
.pin.draft .dot{width:20px;height:20px;background:var(--accent);animation:pulse 1.4s ease-out infinite}
.pin.draft{left:-10px;top:-10px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.pin.draft .dot{animation:none}}

.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:14px 16px;min-width:200px}
.pop h3{font-family:var(--display);font-size:19px;margin:4px 0 2px;line-height:1.3}
.pop .tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.pop .meta{font-size:12.5px;color:var(--ink-3);margin:0}
.pop .note{margin:8px 0 0;white-space:pre-wrap;font-size:13.5px}
.pop .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pop .acts a,.pop .acts button{font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none}

.mapbar{position:absolute;top:64px;left:12px;z-index:800;display:flex;gap:8px;flex-wrap:wrap}
body{transition:grid-template-columns .25s ease,grid-template-rows .25s ease}
#panel{overflow:hidden;min-width:0}
body.collapsed{grid-template-columns:0 1fr}
body.collapsed #panel{border-right:0;visibility:hidden}
#panelToggle{color:var(--ink-2);margin-left:-6px;padding:7px}
#panelToggle:hover{color:var(--ink);background:var(--panel-2)}
@media (prefers-reduced-motion:reduce){body{transition:none}}
#edgeToggle{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:810;width:24px;height:56px;display:grid;place-items:center;
  border:1px solid var(--line);border-left:0;border-radius:0 10px 10px 0;background:var(--panel);color:var(--ink-2);box-shadow:2px 0 8px rgba(0,0,0,.15);padding:0}
#edgeToggle:hover{color:var(--ink);width:28px}
@media (max-width:760px){#edgeToggle{display:none}}
.msearch{position:absolute;top:12px;left:12px;z-index:820;width:min(420px,calc(100% - 76px))}
.msearch .box{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 4px 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.15);color:var(--ink-3)}
.msearch .box:focus-within{border-color:var(--accent)}
.msearch input{flex:1;min-width:0;border:0;background:none;padding:10px 0;outline:none;color:var(--ink)}
.msearch input::-webkit-search-cancel-button{display:none}
#msug{list-style:none;margin:6px 0 0;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:min(60vh,440px);overflow:auto}
#msug li.it{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:8px;cursor:pointer}
#msug li.it[aria-selected="true"],#msug li.it:hover{background:var(--panel-2)}
#msug .ic{width:20px;height:20px;display:grid;place-items:center;color:var(--ink-3);margin-top:1px}
#msug .ic i{width:11px;height:11px;border-radius:50%;background:var(--c)}
#msug .t{font-weight:500;display:block}
#msug .k{font-size:12px;color:var(--accent);margin-left:6px;font-weight:400}
#msug small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msug li.grp{font-size:12px;color:var(--ink-3);padding:8px 10px 2px}
#msug li.info{font-size:13px;color:var(--ink-2);padding:8px 10px}
.pin.found{left:-11px;top:-11px}
.pin.found .dot{width:22px;height:22px;background:#e5483a}
.mapbar button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#pickBanner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:850;background:var(--ink);color:var(--panel);padding:9px 10px 9px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
#pickBanner button{border:0;background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(460px,calc(100vw - 24px));background:var(--panel);color:var(--ink);box-shadow:var(--shadow);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,20,24,.35)}
.dlg-body{padding:20px 22px 8px;overflow:auto}
.dlg-body h2{font-family:var(--display);font-size:22px;margin:0 0 14px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.locrow{display:flex;gap:8px}
.locrow input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.locbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.locbtns .btn{font-size:13px;padding:6px 10px}
#results{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
#results:empty{display:none}
#results button{display:block;width:100%;text-align:left;border:0;background:var(--panel);padding:8px 12px;font-size:13.5px}
#results li+li button{border-top:1px solid var(--line)}
#results button:hover{background:var(--panel-2)}
#results small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small{font-size:12.5px;color:var(--ink-3);margin-top:6px;min-height:1em}
.small.ok{color:var(--accent)}
.small.err{color:var(--danger)}
.dlg-foot{display:flex;gap:8px;align-items:center;padding:12px 22px 18px;border-top:1px solid var(--line)}
.dlg-foot .grow{flex:1}

/* ---------- gate (login / setup / no access) ---------- */
#gate{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:blur(6px)}
.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 26px;box-shadow:var(--shadow)}
.gate-card h1{font-family:var(--display);font-size:30px;margin:0 0 8px;line-height:1.2}
.gate-card p{color:var(--ink-2);margin:0 0 18px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:500}
.gbtn:hover{background:var(--panel-2)}
.gate-card code{background:var(--panel-2);padding:1px 6px;border-radius:6px;font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4000;background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}

@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:minmax(260px,50%) 1fr}
  #mapWrap{order:-1}
  #panel{border-right:0;border-top:1px solid var(--line)}
  .head{padding:10px 16px 6px}
  #tripTitle{font-size:22px}
  #fab{left:auto;right:16px}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.collapsed{grid-template-columns:1fr;grid-template-rows:1fr 0}
}
</style>
</head>
<body>
<aside id="panel">
  <div class="head">
    <div class="who" id="who" hidden><img id="avatar" alt="" referrerpolicy="no-referrer"><span class="grow" id="whoName"></span><button class="linkbtn" id="signOutBtn">登出</button></div>
    <input id="tripTitle" value="我們的旅行地圖" aria-label="地圖名稱" maxlength="40">
    <div class="status" id="status"><i></i><span>準備中…</span></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="places">地點</button>
    <button role="tab" aria-selected="false" data-tab="manage">清單與分類</button>
    <button role="tab" aria-selected="false" data-tab="members" id="membersTab" hidden>成員</button>
  </div>

  <section class="tabpane" id="tab-places">
    <div class="section-title">清單</div>
    <div class="chips" id="listChips"></div>
    <div class="section-title">分類（點一下可隱藏）</div>
    <div class="chips" id="catChips"></div>
    <input id="search" type="search" placeholder="搜尋名稱、描述或備註">
    <ul id="placeList"></ul>
  </section>

  <section class="tabpane" id="tab-manage" hidden>
    <div class="section-title">清單</div>
    <div id="listRows"></div>
    <div class="addrow">
      <input id="newList" placeholder="新清單名稱，例如：東京 Day 1" maxlength="30">
      <button class="btn" id="addList">新增清單</button>
    </div>
    <div class="section-title">分類與顏色</div>
    <div id="catRows"></div>
    <div class="addrow">
      <input id="newCat" placeholder="新分類名稱，例如：咖啡廳" maxlength="20">
      <button class="btn" id="addCat">新增分類</button>
    </div>
  </section>

  <section class="tabpane" id="tab-members" hidden>
    <div class="note-box">只有下面這些 Google 帳號能看到和編輯這張地圖。加入後，把網址傳給對方，對方用這個 email 登入就行了。</div>
    <div id="memberRows"></div>
    <div class="addrow">
      <input id="newMember" type="email" placeholder="朋友的 Gmail，例如 amy@gmail.com" autocomplete="off">
      <button class="btn" id="addMember">加入成員</button>
    </div>
  </section>
</aside>

<main id="mapWrap">
  <div id="map" aria-label="地圖"></div>
  <button id="edgeToggle" aria-controls="panel" title="收合側欄" aria-label="收合側欄"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path id="edgeArrow" d="M15 6l-6 6 6 6"/></svg></button>
  <div class="msearch" id="msearch">
    <div class="box">
      <button class="icon-btn" id="panelToggle" aria-expanded="true" aria-controls="panel" title="收合側欄"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path id="ptArrow" d="M15.5 10l-2 2 2 2"/></svg></button>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="mq" type="search" placeholder="搜尋地點、店名或地址" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="msug">
      <button class="icon-btn" id="mqClear" hidden aria-label="清除搜尋"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ul id="msug" role="listbox" hidden></ul>
  </div>
  <div class="mapbar">
    <button id="toggleTags" aria-pressed="true">隱藏描述</button>
    <button id="fitAll">顯示全部地點</button>
  </div>
  <div id="pickBanner" hidden><span>點地圖選擇位置</span><button id="pickCancel">取消</button></div>
</main>

<button id="fab" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增地點</button>

<dialog id="dlg">
  <form method="dialog" id="placeForm">
    <div class="dlg-body">
      <h2 id="dlgTitle">新增地點</h2>
      <label class="field"><span>名稱</span><input id="fName" required maxlength="60" placeholder="例如：秋葉原扭蛋會館"></label>
      <label class="field"><span>地圖上顯示的描述</span><input id="fLabel" maxlength="20" list="labelOptions" placeholder="留空則顯示分類名稱"></label>
      <datalist id="labelOptions"></datalist>
      <div class="two">
        <label class="field"><span>分類（顏色）</span><select id="fCat"></select></label>

<div id="gate">
  <div class="gate-card" id="gateCard"><h1>旅圖</h1><p>載入中…</p></div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
/* =====================================================================
 *  設定：只要改這兩個地方（詳見 README.md）
 * ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCOst6tf8enx2v1gmVBYj5J7OMLj1hNxYQ",
  authDomain: "trip-map-c1074.firebaseapp.com",
  projectId: "trip-map-c1074",
  storageBucket: "trip-map-c1074.firebasestorage.app",
  messagingSenderId: "570782271612",
  appId: "1:570782271612:web:06afd85c3af66d3ae5e1f9",
  measurementId: "G-R9BSR64S24"
};
// 擁有者的 Google 帳號（要和 firestore.rules 裡的一樣）
const OWNER_EMAIL = "wang770418@gmail.com";
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, getDoc, writeBatch, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const NONE_COLOR = '#8a9497';
const SWATCHES = ['#6a5acd','#e08a00','#d64545','#e055a8','#2e9e6a','#2f7fd1','#8b5a2b','#4b5563'];
const NAME_ZOOM = 15;   // 放大到這個層級以上，標籤會加上地點名稱

const S = {
  lists: [], cats: [], places: [], members: [], title: '',
  activeList: 'all', hiddenCats: new Set(), q: '',
  user: null, isOwner: false, fitted: false,
};
let unsubs = [];

/* ---------------- ui helpers ---------------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }
function setStatus(kind, text){ const el=$('#status'); el.className='status '+(kind||''); el.querySelector('span').textContent=text; }
function gate(html){ $('#gateCard').innerHTML = html; $('#gate').hidden = false; }
function ungate(){ $('#gate').hidden = true; }

/* ---------------- map ---------------- */
const map = L.map('map', { zoomControl:false, worldCopyJump:true, minZoom:2, maxZoom:19 }).setView([28, 125], 4);
L.control.zoom({ position:'topright' }).addTo(map);
L.control.scale({ position:'bottomleft', imperial:false }).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 貢獻者'
}).addTo(map);
map.attributionControl.setPrefix(false);
const markerLayer = L.layerGroup().addTo(map);
const markers = new Map();
const syncNameClass = () => $('#map').classList.toggle('show-names', map.getZoom() >= NAME_ZOOM);
map.on('zoomend', syncNameClass); syncNameClass();

/* ---------------- data helpers ---------------- */
const catOf = p => S.cats.find(c => c.id === p.catId);
const listOf = p => S.lists.find(l => l.id === p.listId);
const colorOf = p => (catOf(p)?.color) || NONE_COLOR;
const labelOf = p => (p.label && p.label.trim()) || catOf(p)?.name || '';
const byOrder = (a,b) => (a.at||0)-(b.at||0) || String(a.name).localeCompare(String(b.name));
function visiblePlaces(){
  const q = S.q.trim().toLowerCase();
  return S.places.filter(p => {
    if (S.activeList !== 'all' && p.listId !== S.activeList) return false;
    if (S.hiddenCats.has(p.catId || '_none')) return false;
    if (q && ![p.name, p.label, p.note, catOf(p)?.name].some(v => String(v||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

/* ---------------- firebase ---------------- */
const configured = !String(FIREBASE_CONFIG.apiKey).startsWith('貼上') && !OWNER_EMAIL.startsWith('you@');
let auth, fdb;
if (!configured){
  gate(`<h1>還差一步設定</h1><p>請打開 <code>index.html</code>，把最上面的 <code>FIREBASE_CONFIG</code> 和 <code>OWNER_EMAIL</code> 換成你自己的，步驟在 README.md。</p>`);
  setStatus('warn', '尚未設定 Firebase');
} else {
  const app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  fdb = getFirestore(app);
  getRedirectResult(auth).catch(e => { console.error(e); toast(authErrorText(e)); });
  onAuthStateChanged(auth, onUser);
}

function authErrorText(e){
  const c = e && e.code || '';
  if (c.includes('unauthorized-domain')) return '這個網址還沒加入 Firebase 的「授權網域」，請擁有者到 Authentication 設定加入';
  if (c.includes('popup-closed') || c.includes('cancelled-popup')) return '登入視窗被關閉了';
  if (c.includes('network')) return '網路連線失敗，請再試一次';
  return '登入失敗：' + (e.message || c);
}

function showLogin(){
  gate(`<h1>旅圖</h1><p>大家一起把想去的地方放進同一張地圖。請用受邀的 Google 帳號登入。</p>
    <button class="gbtn" id="gLogin"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>用 Google 登入</button>`);
  $('#gLogin').addEventListener('click', async () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt:'select_account' });
    try { await signInWithPopup(auth, provider); }
    catch(e){
      if ((e.code||'').includes('popup-blocked')) { try { await signInWithRedirect(auth, provider); } catch(e2){ toast(authErrorText(e2)); } }
      else toast(authErrorText(e));
    }
  });
}

function stopAll(){ unsubs.forEach(u => { try{u();}catch(e){} }); unsubs = []; }

async function onUser(u){
  stopAll();
  S.user = u; S.lists=[]; S.cats=[]; S.places=[]; S.members=[]; S.fitted=false;
  render();
  if (!u){ $('#who').hidden = true; setStatus('warn','尚未登入'); showLogin(); return; }

  const email = (u.email||'').toLowerCase();
  S.isOwner = email === OWNER_EMAIL.toLowerCase();
  $('#who').hidden = false;
  $('#whoName').textContent = u.displayName ? `${u.displayName}（${u.email}）` : u.email;
  if (u.photoURL) $('#avatar').src = u.photoURL; else $('#avatar').hidden = true;
  $('#membersTab').hidden = !S.isOwner;
  setStatus('', '連線中…');
  gate(`<h1>旅圖</h1><p>確認權限中…</p>`);

  // 確認是否為成員（規則會擋下非成員）
  try {
    const snap = await getDoc(doc(fdb, 'config', 'members'));
    if (!snap.exists()){
      if (S.isOwner) await seed();
      else return noAccess(u);
    }
  } catch(e){
    if (e.code === 'permission-denied') return noAccess(u);
    console.error(e);
    gate(`<h1>連不上資料庫</h1><p>${esc(e.message||e.code)}</p><button class="gbtn" id="retry">重新整理</button>`);
    $('#retry').addEventListener('click', () => location.reload());
    return;
  }
  ungate();
  subscribe();
}

function noAccess(u){
  setStatus('warn','沒有權限');
  gate(`<h1>還不能進入</h1><p>你登入的帳號是 <code>${esc(u.email)}</code>，它還不在這張地圖的成員名單裡。請地圖擁有者在「成員」分頁加入這個 email，再重新整理這個頁面。</p>
    <button class="gbtn" id="switchAcc">換一個帳號登入</button>`);
  $('#switchAcc').addEventListener('click', () => signOut(auth));
}

async function seed(){
  const b = writeBatch(fdb); const at = Date.now();
  b.set(doc(fdb,'config','members'), { emails: [] });
  b.set(doc(fdb,'meta','trip'), { title:'我們的旅行地圖' });
  b.set(doc(fdb,'lists','main'), { name:'我的清單', at });
  [['住宿','#6a5acd'],['賣場','#e08a00'],['餐廳','#d64545'],['扭蛋','#e055a8'],['景點','#2e9e6a']]
    .forEach(([name,color],i) => b.set(doc(fdb,'cats','c'+i), { name, color, at:at+i }));
  await b.commit();
  toast('已建立地圖與預設分類');
}

function subscribe(){
  const pending = new Set(['lists','cats','places']);
  const onErr = e => {
    console.error(e);
    if (e.code === 'permission-denied'){ stopAll(); noAccess(S.user); }
    else setStatus('warn','同步中斷，請重新整理頁面');
  };
  ['lists','cats','places'].forEach(key => {
    unsubs.push(onSnapshot(collection(fdb, key), snap => {
      S[key] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      if (!snap.metadata.fromCache) pending.delete(key);
      if (!pending.size) setStatus('live','即時同步，大家看到同一份');
      render();
      if (key === 'places') fitIfFirst();
    }, onErr));
  });
  unsubs.push(onSnapshot(doc(fdb,'meta','trip'), snap => {
    S.title = (snap.exists() && snap.data().title) || '我們的旅行地圖';
    document.title = S.title + '・旅圖';
    if (document.activeElement !== $('#tripTitle')) $('#tripTitle').value = S.title;
  }, onErr));
  if (S.isOwner){
    unsubs.push(onSnapshot(doc(fdb,'config','members'), snap => {
      S.members = (snap.exists() && snap.data().emails) || []; renderMembers();
    }, onErr));
  }
}

async function put(coll, id, data){
  try { await setDoc(doc(fdb, coll, id), data); return true; }
  catch(e){ return writeFailed(e); }
}
async function remove(coll, id){
  try { await deleteDoc(doc(fdb, coll, id)); return true; }
  catch(e){ return writeFailed(e); }
}
function writeFailed(e){
  console.error(e);
  toast(e.code === 'permission-denied' ? '沒有權限修改，可能已被移出成員名單' : '儲存失敗，請稍後再試');
  return false;
}

function fitIfFirst(){ if (S.fitted || !S.places.length) return; S.fitted = true; fitVisible(false); }
function fitVisible(animate=true){
  const pts = visiblePlaces().map(p=>[p.lat,p.lng]);
  if (!pts.length) return;
  if (pts.length === 1) map.setView(pts[0], 16, {animate});
  else map.fitBounds(pts, { padding:[50,50], maxZoom:16, animate });
}

/* ---------------- rendering ---------------- */
function render(){
  S.lists.sort(byOrder); S.cats.sort(byOrder);
  if (S.activeList !== 'all' && !S.lists.some(l=>l.id===S.activeList)) S.activeList = 'all';
  $('#fab').hidden = !S.user;
  renderChips(); renderPlaceList(); renderManage(); renderMarkers(); renderDatalist();
}

function renderChips(){
  const count = id => S.places.filter(p => id==='all' || p.listId===id).length;
  $('#listChips').innerHTML = [{id:'all',name:'全部'}, ...S.lists].map(l =>
    `<button class="chip" data-list="${esc(l.id)}" aria-pressed="${S.activeList===l.id}">${esc(l.name)} <span style="opacity:.6">${count(l.id)}</span></button>`
  ).join('') + `<button class="chip add" data-goto="manage">＋ 清單</button>`;
  const cats = [...S.cats];
  if (S.places.some(p => !catOf(p))) cats.push({id:'_none', name:'未分類', color:NONE_COLOR});
  $('#catChips').innerHTML = cats.map(c =>
    `<button class="chip cat" style="--c:${esc(c.color)}" data-cat="${esc(c.id)}" aria-pressed="${!S.hiddenCats.has(c.id)}"><span class="sw"></span>${esc(c.name)}</button>`
  ).join('') + `<button class="chip add" data-goto="manage">＋ 分類</button>`;
}

function renderPlaceList(){
  const ul = $('#placeList');
  const items = visiblePlaces().sort((a,b)=>(b.at||0)-(a.at||0));
  if (!items.length){
    ul.innerHTML = `<li class="empty">${!S.places.length
      ? '還沒有任何地點。按「新增地點」，或在地圖上按右鍵（手機長按）就能加入第一個。'
      : '沒有符合的地點，試試切換清單或打開被隱藏的分類。'}</li>`;
    return;
  }
  ul.innerHTML = items.map(p => {
    const lst = listOf(p);
    return `<li><button class="place" data-place="${esc(p.id)}" style="--c:${esc(colorOf(p))}">
      <span class="sw"></span>
      <span><span class="nm">${esc(p.name)}</span><span class="sub">${esc(lst?lst.name:'')}${p.byName?' ／ '+esc(p.byName)+' 新增':''}</span></span>
      ${labelOf(p)?`<span class="lbl">${esc(labelOf(p))}</span>`:''}
    </button></li>`;
  }).join('');
}

const trashSvg = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
function renderManage(){
  $('#listRows').innerHTML = S.lists.length ? S.lists.map(l => `
    <div class="row" data-list-row="${esc(l.id)}">
      <span class="listicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span>
      <input type="text" value="${esc(l.name)}" data-field="list-name" aria-label="清單名稱">
      <span class="count">${S.places.filter(p=>p.listId===l.id).length} 個</span>
      <button class="icon-btn" data-del-list="${esc(l.id)}" aria-label="刪除清單">${trashSvg}</button>
    </div>`).join('') : '<p class="empty">還沒有清單。</p>';
  $('#catRows').innerHTML = S.cats.length ? S.cats.map(c => `
    <div class="row" data-cat-row="${esc(c.id)}">
      <input type="color" value="${esc(c.color)}" data-field="cat-color" aria-label="${esc(c.name)} 的顏色">
      <input type="text" value="${esc(c.name)}" data-field="cat-name" aria-label="分類名稱">
      <span class="count">${S.places.filter(p=>p.catId===c.id).length} 個</span>
      <button class="icon-btn" data-del-cat="${esc(c.id)}" aria-label="刪除分類">${trashSvg}</button>
    </div>`).join('') : '<p class="empty">還沒有分類。新增一個並選顏色，例如住宿、餐廳、扭蛋。</p>';
}

function renderMembers(){
  const rows = [`<div class="row"><span class="listicon">★</span><span class="mail">${esc(OWNER_EMAIL)}</span><span class="count">擁有者</span><span></span></div>`]
    .concat(S.members.map(m => `<div class="row"><span class="listicon">●</span><span class="mail">${esc(m)}</span><span class="count">成員</span>
      <button class="icon-btn" data-del-member="${esc(m)}" aria-label="移除 ${esc(m)}">${trashSvg}</button></div>`));
  $('#memberRows').innerHTML = rows.join('');
}

function renderDatalist(){
  const opts = new Set([...S.cats.map(c=>c.name), ...S.places.map(p=>p.label).filter(Boolean)]);
  $('#labelOptions').innerHTML = [...opts].map(o=>`<option value="${esc(o)}">`).join('');
}

function pinHtml(p){
  const lbl = labelOf(p);
  return `<div class="pin" style="--c:${esc(colorOf(p))}"><span class="dot"></span><span class="tag">${lbl?`<span class="lb">${esc(lbl)}</span>`:''}<span class="pn">${esc(p.name)}</span></span></div>`;
}
function popupHtml(id){
  const p = S.places.find(x=>x.id===id); if (!p) return '';
  const cat = catOf(p), lst = listOf(p), lbl = labelOf(p);
  const g = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  return `<div class="pop" style="--c:${esc(colorOf(p))}">
    ${lbl?`<span class="tag">${esc(lbl)}</span>`:''}
    <h3>${esc(p.name)}</h3>
    <p class="meta">${esc(cat?cat.name:'未分類')}，在「${esc(lst?lst.name:'—')}」清單</p>
    ${p.byName?`<p class="meta">${esc(p.byName)} 新增</p>`:''}
    ${p.note?`<p class="note">${esc(p.note)}</p>`:''}
    <div class="acts">
      <button data-edit="${esc(p.id)}">編輯</button>
      <a href="${g}" target="_blank" rel="noopener">在 Google 地圖開啟</a>
    </div></div>`;
}
function renderMarkers(){
  const vis = new Set(visiblePlaces().map(p=>p.id));
  for (const [id, m] of markers){ if (!vis.has(id)){ markerLayer.removeLayer(m); markers.delete(id); } }
  S.places.forEach(p => {
    if (!vis.has(p.id)) return;
    const html = pinHtml(p);
    let m = markers.get(p.id);
    if (!m){
      m = L.marker([p.lat,p.lng], { icon: L.divIcon({ html, className:'', iconSize:[0,0] }), riseOnHover:true, title:p.name });
      m._html = html;
      m.bindPopup(() => popupHtml(p.id), { maxWidth:280, offset:[0,-6] });
      markerLayer.addLayer(m); markers.set(p.id, m);
    } else {
      const ll = m.getLatLng();
      if (ll.lat!==p.lat || ll.lng!==p.lng) m.setLatLng([p.lat,p.lng]);
      if (m._html !== html){ m.setIcon(L.divIcon({ html, className:'', iconSize:[0,0] })); m._html = html; }
      if (m.isPopupOpen()) m.getPopup().setContent(popupHtml(p.id));
    }
  });
}

/* ---------------- panel events ---------------- */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===t));
  ['places','manage','members'].forEach(k => $('#tab-'+k).hidden = k!==t);
}
$('#panel').addEventListener('click', e => {
  const g = e.target.closest('[data-goto]'); if (g){ showTab(g.dataset.goto); return; }
  const l = e.target.closest('[data-list]'); if (l){ S.activeList = l.dataset.list; render(); fitVisible(); return; }
  const c = e.target.closest('[data-cat]');
  if (c){ const id=c.dataset.cat; S.hiddenCats.has(id)?S.hiddenCats.delete(id):S.hiddenCats.add(id); render(); return; }
  const p = e.target.closest('[data-place]'); if (p){ focusPlace(p.dataset.place); return; }
  const dl = e.target.closest('[data-del-list]'); if (dl){ deleteList(dl.dataset.delList); return; }
  const dc = e.target.closest('[data-del-cat]'); if (dc){ deleteCat(dc.dataset.delCat); return; }
  const dm = e.target.closest('[data-del-member]'); if (dm){ removeMember(dm.dataset.delMember); return; }
});
$('#panel').addEventListener('change', e => {
  const f = e.target.dataset.field; if (!f) return;
  const lr = e.target.closest('[data-list-row]'), cr = e.target.closest('[data-cat-row]');
  if (f==='list-name' && lr){
    const l = S.lists.find(x=>x.id===lr.dataset.listRow); const v = e.target.value.trim();
    if (l && v && v!==l.name) put('lists', l.id, {name:v, at:l.at||Date.now()});
  }
  if (cr){
    const c = S.cats.find(x=>x.id===cr.dataset.catRow); if (!c) return;
    if (f==='cat-name'){ const v=e.target.value.trim(); if (v && v!==c.name) put('cats', c.id, {name:v, color:c.color, at:c.at||Date.now()}); }
    if (f==='cat-color' && e.target.value!==c.color) put('cats', c.id, {name:c.name, color:e.target.value, at:c.at||Date.now()});
  }

/* ---------------- geocoding (OpenStreetMap Nominatim) ---------------- */
let lastGeo = 0;
async function nominatim(path){
  const wait = 1100 - (Date.now() - lastGeo); if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastGeo = Date.now();
  const res = await fetch('https://nominatim.openstreetmap.org/' + path, { headers:{ 'Accept-Language':'zh-TW,zh,ja,en' } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function searchPlaces(q){
  const b = map.getBounds();
  const vb = `${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
  return nominatim(`search?format=jsonv2&limit=6&q=${encodeURIComponent(q)}&viewbox=${encodeURIComponent(vb)}`);
}
async function reverseName(ll){
  return nominatim(`reverse?format=jsonv2&zoom=18&lat=${ll.lat}&lon=${ll.lng}`);
}

function parseLoc(str){
  const s = String(str||'').trim(); if (!s) return null;
  const pats = [/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/, /@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/, /[?&](?:q|query|ll|center|destination)=(-?\d+(?:\.\d+)?)(?:,|%2C)\s*(-?\d+(?:\.\d+)?)/i, /^\s*(-?\d+(?:\.\d+)?)\s*[,，\s]\s*(-?\d+(?:\.\d+)?)\s*$/];
  for (const re of pats){ const m = s.match(re); if (m){ const lat=+m[1], lng=+m[2]; if (Math.abs(lat)<=90 && Math.abs(lng)<=180) return L.latLng(lat,lng); } }
  return null;
}
function msg(text, kind=''){ const m=$('#locMsg'); m.className='small '+kind; m.textContent=text; }
function setDraft(ll, text){
  draftLL = ll;
  if (!ll){ if (draft){ map.removeLayer(draft); draft=null; } return; }
  msg(text || '位置已設定，可以拖曳地圖上的藍點微調', 'ok');
  if (!draft){
    draft = L.marker(ll, { draggable:true, zIndexOffset:1000, icon:L.divIcon({ html:'<div class="pin draft"><span class="dot"></span></div>', className:'', iconSize:[0,0] }) }).addTo(map);
    draft.on('dragend', () => setDraft(draft.getLatLng(), '已調整位置'));
  } else draft.setLatLng(ll);
}
async function suggestNameFor(ll){
  try {

    if (!draftLL || draftLL.distanceTo(ll) > 1) return;
    const nm = r && (r.name || (r.display_name||'').split(',')[0]);

}

/* ---------------- 地圖搜尋（邊打字邊列出結果，使用 OpenStreetMap 的 Photon 服務） ---------------- */
const mq = $('#mq'), msug = $('#msug');
let sugItems = [], sugIdx = -1, sugTimer = null, sugAbort = null, sugState = { q:'', feats:null, err:false };
let found = null, foundMarker = null;
const KIND = {restaurant:'餐廳',cafe:'咖啡廳',fast_food:'速食',food_court:'美食街',bar:'酒吧',pub:'酒吧',izakaya:'居酒屋',
  hotel:'飯店',hostel:'青年旅館',guest_house:'民宿',motel:'旅館',apartment:'公寓',
  station:'車站',halt:'車站',subway_entrance:'地鐵出入口',bus_station:'巴士站',aerodrome:'機場',ferry_terminal:'碼頭',
  supermarket:'超市',convenience:'便利商店',mall:'購物中心',department_store:'百貨公司',toys:'玩具店',games:'遊戲店',
  anime:'動漫店',video_games:'電玩店',books:'書店',electronics:'電器行',clothes:'服飾店',pharmacy:'藥局',chemist:'藥妝店',
  cosmetics:'美妝店',bakery:'麵包店',confectionery:'甜點店',variety_store:'雜貨店',gift:'禮品店',
  attraction:'景點',museum:'博物館',gallery:'美術館',viewpoint:'展望點',theme_park:'主題樂園',zoo:'動物園',aquarium:'水族館',
  park:'公園',garden:'庭園',temple:'寺廟',shrine:'神社',place_of_worship:'宗教場所',castle:'城堡',
  city:'城市',town:'城鎮',village:'村落',suburb:'地區',quarter:'地區',neighbourhood:'街區',island:'島嶼',
  state:'省/縣',province:'省',country:'國家',residential:'道路',primary:'道路',secondary:'道路',tertiary:'道路'};
const isArea = p => p.osm_key === 'place' || p.osm_key === 'boundary' || p.type === 'city' || p.type === 'state' || p.type === 'country' || p.type === 'district';
const uniq = a => a.filter((v,i) => v && a.indexOf(v) === i);
function photonAddr(p){
  return uniq([[p.street, p.housenumber].filter(Boolean).join(' '), p.district || p.locality, p.city, p.county, p.state, p.country])
    .filter(v => v !== p.name).join(', ');
}
async function photon(q){
  if (sugAbort) sugAbort.abort();
  sugAbort = new AbortController();
  const c = map.getCenter();
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}&zoom=${Math.round(map.getZoom())}&location_bias_scale=0.4`;
  const r = await fetch(url, { signal: sugAbort.signal });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).features || [];
}

function buildItems(q){
  const items = [];
  const ql = q.toLowerCase();
  const ll = parseLoc(q);
  if (ll) items.push({ kind:'coord', ll, name:'', addr:`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}` });
  const mine = S.places.filter(p => [p.name, p.label, p.note].some(v => String(v||'').toLowerCase().includes(ql))).slice(0, 5);
  if (mine.length){ items.push({ kind:'head', text:'已存的地點' }); mine.forEach(p => items.push({ kind:'saved', p })); }
  if (!ll){
    items.push({ kind:'head', text:'搜尋結果' });
    if (sugState.err) items.push({ kind:'info', text:'搜尋服務暫時無法使用，請稍後再試' });
    else if (sugState.feats === null) items.push({ kind:'info', text: q.length < 2 ? '再多打幾個字…' : '搜尋中…' });
    else if (!sugState.feats.length) items.push({ kind:'info', text:'找不到符合的地方，試著加上城市名稱' });
    else sugState.feats.forEach(f => {
      const pr = f.properties || {};
      items.push({ kind:'osm', f, name: pr.name || [pr.street, pr.housenumber].filter(Boolean).join(' ') || pr.city || q,
        addr: photonAddr(pr), tag: KIND[pr.osm_value] || '' });
    });
  }
  return items;
}
const selectable = it => it.kind === 'saved' || it.kind === 'osm' || it.kind === 'coord';

function renderSug(){
  const q = mq.value.trim();
  if (!q){ closeSug(); return; }
  sugItems = buildItems(q);
  const pinSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
  msug.innerHTML = sugItems.map((it, i) => {
    if (it.kind === 'head') return `<li class="grp" role="presentation">${esc(it.text)}</li>`;
    if (it.kind === 'info') return `<li class="info" role="presentation">${esc(it.text)}</li>`;
    const sel = i === sugIdx;
    if (it.kind === 'saved'){
      const p = it.p, lst = listOf(p);
      return `<li class="it" role="option" data-i="${i}" aria-selected="${sel}"><span class="ic"><i style="--c:${esc(colorOf(p))}"></i></span>
        <span><span class="t">${esc(p.name)}${labelOf(p)?`<span class="k">${esc(labelOf(p))}</span>`:''}</span><small>${esc(lst ? lst.name : '')}</small></span></li>`;
    }
    if (it.kind === 'coord') return `<li class="it" role="option" data-i="${i}" aria-selected="${sel}"><span class="ic">${pinSvg}</span><span><span class="t">前往這個座標</span><small>${esc(it.addr)}</small></span></li>`;
    return `<li class="it" role="option" data-i="${i}" aria-selected="${sel}"><span class="ic">${pinSvg}</span>
      <span><span class="t">${esc(it.name)}${it.tag?`<span class="k">${esc(it.tag)}</span>`:''}</span><small>${esc(it.addr)}</small></span></li>`;
  }).join('');
  msug.hidden = false; mq.setAttribute('aria-expanded', 'true');
}
function closeSug(){ msug.hidden = true; mq.setAttribute('aria-expanded', 'false'); sugIdx = -1; }

function chooseItem(it){
  if (!it) return;
  closeSug(); mq.blur();
  if (it.kind === 'saved'){ clearFound(); focusPlace(it.p.id); return; }
  let ll, name = '', addr = '', tag = '';
  if (it.kind === 'coord'){ ll = it.ll; addr = it.addr; }
  else {
    const pr = it.f.properties || {}, [lng, lat] = it.f.geometry.coordinates;
    ll = L.latLng(lat, lng); name = it.name; addr = it.addr; tag = it.tag;
    const ex = pr.extent;
    if (ex && isArea(pr)) map.fitBounds([[ex[3], ex[0]], [ex[1], ex[2]]], { maxZoom: 15 });
    else map.setView(ll, Math.max(map.getZoom(), 17));
  }
  if (it.kind === 'coord') map.setView(ll, Math.max(map.getZoom(), 17));
  showFound({ ll, name, addr, tag });
}
function showFound(f){
  clearFound();
  found = f;
  foundMarker = L.marker(f.ll, { zIndexOffset: 900, icon: L.divIcon({ html:'<div class="pin found"><span class="dot"></span></div>', className:'', iconSize:[0,0] }) }).addTo(map);
  const gq = f.name ? encodeURIComponent(f.name + (f.addr ? ' ' + f.addr : '')) : `${f.ll.lat},${f.ll.lng}`;
  foundMarker.bindPopup(`<div class="pop">${f.tag?`<span class="tag" style="--c:#e5483a">${esc(f.tag)}</span>`:''}
    <h3>${esc(f.name || '搜尋的位置')}</h3><p class="meta">${esc(f.addr)}</p>
    <div class="acts">${S.user ? '<button data-add-found>加入地圖</button>' : ''}
    <a href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">在 Google 地圖開啟</a></div></div>`,
    { maxWidth: 280, offset: [0, -8] });
  map.once('moveend', () => foundMarker && foundMarker.openPopup());
  setTimeout(() => { if (foundMarker && !foundMarker.isPopupOpen()) foundMarker.openPopup(); }, 700);
}
function clearFound(){ if (foundMarker){ map.removeLayer(foundMarker); foundMarker = null; } found = null; }

mq.addEventListener('input', () => {
  const q = mq.value.trim();
  $('#mqClear').hidden = !mq.value;
  sugIdx = -1; clearTimeout(sugTimer);
  sugState = { q, feats: null, err: false };
  if (!q){ closeSug(); return; }
  renderSug();
  if (q.length < 2 || parseLoc(q)) return;
  sugTimer = setTimeout(async () => {
    try {
      const feats = await photon(q);
      if (mq.value.trim() !== q) return;
      sugState = { q, feats, err: false }; renderSug();
    } catch(e){
      if (e.name === 'AbortError') return;
      console.error(e); sugState = { q, feats: [], err: true }; renderSug();
    }
  }, 300);
});
mq.addEventListener('focus', () => { if (mq.value.trim()) renderSug(); });
mq.addEventListener('keydown', async e => {
  const sels = sugItems.map((it, i) => selectable(it) ? i : -1).filter(i => i >= 0);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); if (!sels.length) return;
    const pos = sels.indexOf(sugIdx);
    sugIdx = e.key === 'ArrowDown' ? sels[(pos + 1) % sels.length] : sels[(pos - 1 + sels.length) % sels.length];
    renderSug();
    msug.querySelector('[aria-selected="true"]')?.scrollIntoView({ block:'nearest' });
  } else if (e.key === 'Enter'){
    e.preventDefault();
    const q = mq.value.trim(); if (!q) return;
    if (sugIdx >= 0) return chooseItem(sugItems[sugIdx]);
    if (sugState.q === q && sugState.feats !== null && !parseLoc(q)){
      const first = sugItems.find(it => it.kind === 'osm') || sugItems.find(selectable);
      return first ? chooseItem(first) : renderSug();
    }
    if (parseLoc(q)) return chooseItem(sugItems.find(it => it.kind === 'coord'));
    clearTimeout(sugTimer);
    try {
      const feats = await photon(q);
      sugState = { q, feats, err: false };
      sugItems = buildItems(q);
      const first = sugItems.find(it => it.kind === 'osm');
      first ? chooseItem(first) : renderSug();
    } catch(err){ if (err.name !== 'AbortError'){ sugState = { q, feats: [], err: true }; renderSug(); } }
  } else if (e.key === 'Escape'){ closeSug(); }
});
msug.addEventListener('mousedown', e => e.preventDefault());
msug.addEventListener('click', e => { const li = e.target.closest('[data-i]'); if (li) chooseItem(sugItems[+li.dataset.i]); });
document.addEventListener('click', e => { if (!e.target.closest('#msearch')) closeSug(); });
$('#mqClear').addEventListener('click', () => { mq.value = ''; $('#mqClear').hidden = true; closeSug(); clearFound(); mq.focus(); });
L.DomEvent.disableClickPropagation($('#msearch'));
L.DomEvent.disableScrollPropagation($('#msearch'));

/* ---------------- 側欄收合 ---------------- */
const isMobile = () => matchMedia('(max-width:760px)').matches;
function setPanel(open, save = true){
  document.body.classList.toggle('collapsed', !open);
  const b = $('#panelToggle');
  b.setAttribute('aria-expanded', open);
  b.title = open ? (isMobile() ? '收合清單' : '收合側欄') : (isMobile() ? '展開清單' : '展開側欄');
  b.setAttribute('aria-label', b.title);
  $('#ptArrow').setAttribute('d', open ? 'M15.5 10l-2 2 2 2' : 'M13.5 10l2 2-2 2');
  $('#edgeArrow').setAttribute('d', open ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6');
  $('#edgeToggle').title = b.title; $('#edgeToggle').setAttribute('aria-label', b.title);
  if (save) try { localStorage.setItem('tripmap-panel', open ? 'open' : 'closed'); } catch(e){}
  // 等版面動畫結束後讓地圖重新計算大小
  setTimeout(() => map.invalidateSize({ pan:false }), 280);
}
$('#panelToggle').addEventListener('click', () => setPanel(document.body.classList.contains('collapsed')));
$('#edgeToggle').addEventListener('click', () => setPanel(document.body.classList.contains('collapsed')));
L.DomEvent.disableClickPropagation($('#edgeToggle'));
(() => { let s = null; try { s = localStorage.getItem('tripmap-panel'); } catch(e){} if (s === 'closed') setPanel(false, false); })();

render();
</script>
